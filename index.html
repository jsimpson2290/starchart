<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Star Charts</title>
<style>
:root{
  --bg:#F3F4F6; --bar:#FFFFFF; --ink:#1A1A1A; --line:#D5D9DE; --muted:#E7EAEE;
  --boy:#1F5FBF; --girl:#C2006F;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#10141C;--bar:#1B2230;--ink:#EEF1F6;--line:#34405A;--muted:#2A3550;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#10141C;--bar:#1B2230;--ink:#EEF1F6;--line:#34405A;--muted:#2A3550;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;
  background:var(--bg);color:var(--ink);
  font:600 18px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabs{
  flex:none;display:flex;gap:8px;padding:8px 10px;
  background:var(--bar);border-bottom:1px solid var(--line);
}
.tab{
  flex:1;min-height:48px;border:2px solid var(--line);border-radius:12px;
  background:var(--muted);color:var(--ink);font:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  touch-action:manipulation;
}
.tab .dot{width:14px;height:14px;border-radius:50%;flex:none}
.tab[data-id="boy"] .dot{background:var(--boy)}
.tab[data-id="girl"] .dot{background:var(--girl)}
.tab[aria-selected="true"]{color:#FFFFFF;border-color:transparent}
.tab[data-id="boy"][aria-selected="true"]{background:var(--boy)}
.tab[data-id="girl"][aria-selected="true"]{background:var(--girl)}
.tab[aria-selected="true"] .dot{background:#FFFFFF}
.tab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.stage{flex:1;min-height:0;position:relative}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
@keyframes frameIn{from{opacity:0}to{opacity:1}}
.frame.enter{animation:frameIn .14s ease-out}
@media (prefers-reduced-motion:reduce){.frame.enter{animation:none}}
.frame[hidden]{display:none}
</style>
</head>
<body>
<div class="tabs" role="tablist" aria-label="Choose a star chart">
  <button class="tab" id="tab-boy" data-id="boy" role="tab" aria-controls="frame-boy" aria-selected="true" type="button"><span class="dot"></span>Pirate Castle</button>
  <button class="tab" id="tab-girl" data-id="girl" role="tab" aria-controls="frame-girl" aria-selected="false" type="button"><span class="dot"></span>Super Star</button>
</div>
<div class="stage">
  <iframe class="frame" id="frame-boy" title="Pirate Castle star chart" data-src="boy-star-chart.html"></iframe>
  <iframe class="frame" id="frame-girl" title="Super Star star chart" data-src="girl-star-chart.html" hidden></iframe>
</div>

<script>
(function () {
  'use strict';
  var IDS = ['boy', 'girl'];
  var KEY = 'star-chart-last-tab';
  var tabs = {}, frames = {}, loaded = {};
  IDS.forEach(function (id) {
    tabs[id] = document.getElementById('tab-' + id);
    frames[id] = document.getElementById('frame-' + id);
    tabs[id].addEventListener('click', function () { show(id); });
    tabs[id].addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        var next = IDS[(IDS.indexOf(id) + (e.key === 'ArrowRight' ? 1 : IDS.length - 1)) % IDS.length];
        show(next); tabs[next].focus();
      }
    });
  });

  function show(id) {
    IDS.forEach(function (k) {
      var on = k === id;
      tabs[k].setAttribute('aria-selected', on ? 'true' : 'false');
      tabs[k].tabIndex = on ? 0 : -1;
      if (on && !loaded[k]) { frames[k].src = frames[k].getAttribute('data-src'); loaded[k] = true; }
      if (on) {
        var f = frames[k], wasHidden = f.hidden;
        f.hidden = false;
        if (wasHidden) { f.classList.remove('enter'); void f.offsetWidth; f.classList.add('enter'); }
      } else {
        frames[k].classList.remove('enter');
        frames[k].hidden = true;
      }
    });
    try { localStorage.setItem(KEY, id); } catch (e) {}
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  }

  var start = (location.hash || '').replace('#', '');
  if (IDS.indexOf(start) < 0) { try { start = localStorage.getItem(KEY); } catch (e) { start = null; } }
  if (IDS.indexOf(start) < 0) start = 'boy';
  show(start);
})();
</script>
</body>
</html>
